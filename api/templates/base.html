{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="{% static 'css/reset.css' %}"/>
    <link rel="stylesheet" href="{% static 'css/header.css' %}"/>
    <link rel="stylesheet" href="{% static 'css/base.css' %}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;700&display=swap"
            rel="stylesheet"
    />
    <title>{% block title %}{% endblock %}</title>
    {% block style %}{% endblock %}

    <script>
        {% if DEBUG == 'False' %}
            document.addEventListener('keydown', function (event) {
                if (event.key === 'PrintScreen') {
                    event.preventDefault();
                    alert('Скриншоты запрещены!');
                }
            });

            document.addEventListener('contextmenu', function (event) {
                event.preventDefault();
            });

            window.addEventListener('blur', function () {
                document.body.classList.add('blur-active');
            });

            window.addEventListener('focus', function () {
                document.body.classList.remove('blur-active');
            });

            document.addEventListener('keydown', function (e) {
                if (e.ctrlKey && (e.key === 's' || e.key === 'u' || e.key === 'p' || e.key === 'c' || e.key === 'x' || e.key === 'v' || e.key === 'с')) {
                    e.preventDefault();
                }
            });

            document.addEventListener('contextmenu', event => event.preventDefault());
            document.onselectstart = () => false;
            document.oncopy = () => false;
        {% endif %}
    </script>
</head>
<body>
{% block content %}
{% endblock %}
</body>
</html>
